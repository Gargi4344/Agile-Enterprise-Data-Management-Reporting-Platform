spring:
  application:
    name: agile-enterprise-data-management-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aedmp}
    username: ${DB_USERNAME:aedmp_app}
    password: ${DB_PASSWORD:aedmp_app_password}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

aedmp:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: aedmp-platform
  storage:
    mode: ${STORAGE_MODE:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/datasets}
    s3-bucket: ${STORAGE_S3_BUCKET:}
  quality:
    default-pass-threshold: 90.0
  demo:
    mode-banner: ${DEMO_MODE:true}

logging:
  level:
    root: INFO
    com.aedmp.platform: INFO
  pattern:
    console: "%d{ISO8601} [%X{requestId}] %-5level %logger{36} - %msg%n"
